services:
  # MongoDB (for local development/testing)
  mongodb:
    image: mongo:7
    container_name: assetflow-mongodb
    restart: unless-stopped
    volumes:
      - mongodb_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=assetflow
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - assetflow-network

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: assetflow-backend
    restart: unless-stopped
    environment:
      - MONGODB_URI=mongodb://mongodb:27017
      - DB_NAME=assetflow
      - JWT_SECRET=${JWT_SECRET:-change-this-secret-key}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:8080,http://localhost}
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      - backend_uploads:/app/uploads
    networks:
      - assetflow-network
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8001/api/health').raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: assetflow-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      - backend
    networks:
      - assetflow-network

volumes:
  mongodb_data:
    driver: local
  backend_uploads:
    driver: local

networks:
  assetflow-network:
    driver: bridge
